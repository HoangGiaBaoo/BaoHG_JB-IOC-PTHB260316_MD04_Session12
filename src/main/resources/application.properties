spring.application.name=md04_ss12
server.port=8080

# ===== PostgreSQL =====
spring.datasource.url=jdbc:postgresql://localhost:5432/md04_ss12
spring.datasource.username=postgres
spring.datasource.password=Giabao2005@
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ===== Redis (Cache, Pub/Sub, Redisson lock) =====
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
# Bai 1: TTL cua cache san pham
app.cache.product-ttl=30m

# ===== Kafka =====
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=org.example.md04_ss12.event
spring.kafka.consumer.auto-offset-reset=earliest

# Ten topic / channel
app.kafka.topic.order-events=order-events
app.kafka.topic.shipping-events=shipping-events
app.kafka.topic.flash-sale-orders=flash-sale-orders
app.redis.channel.promotion-updates=promotion-updates
